{% extends "layout.html" %}

{% block content %}

<style>
.search-container{
    max-width:1200px;
    margin:30px auto;
    padding:20px;
}

.search-title{
    text-align:center;
    margin-bottom:25px;
    color:#2e7d32;
}

.products-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.plant-card{
    background:#fff;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
    padding:15px;
    text-align:center;
    transition:.3s;
}

.plant-card:hover{
    transform:translateY(-5px);
}

.plant-card img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:10px;
}

.plant-card h3{
    margin:15px 0 10px;
    color:#2e7d32;
}

.price{
    color:#e53935;
    font-size:18px;
    font-weight:bold;
}

.category{
    color:#555;
}

.no-result{
    text-align:center;
    font-size:22px;
    color:#888;
    margin-top:50px;
}
</style>

<div class="search-container">

    <h2 class="search-title">
        🔍 Search Results for "{{ query }}"
    </h2>

    {% if results %}

    <div class="products-grid">

        {% for item in results %}

        <div class="plant-card">

            <img src="{{ url_for('static', filename='images/' + item['image']) }}"
                 alt="{{ item['name'] }}">

            <h3>{{ item['name'] }}</h3>

            <p class="price">₹{{ item['price'] }}</p>

            <p class="category">
                <strong>Category:</strong> {{ item['category'] }}
            </p>

        </div>

        {% endfor %}

    </div>

    {% else %}

    <div class="no-result">
        😢 No products found for "<b>{{ query }}</b>"
    </div>

    {% endif %}

</div>

{% endblock %}
