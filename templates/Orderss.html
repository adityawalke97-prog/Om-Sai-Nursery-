{% extends "Home.html" %}
{% block content %}

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: #f1f3f6;
}

/* PAGE LAYOUT */
.page{
    max-width:1200px;
    margin:30px auto;
    padding:15px;
    display:flex;
    gap:20px;
}

/* LEFT CART */
.left{
    flex:2;
}

/* RIGHT SUMMARY */
.right{
    flex:1;
}

/* CARD */
.card{
    background:white;
    border-radius:14px;
    padding:18px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
    margin-bottom:15px;
}

/* TITLE */
h2{
    margin:0 0 15px;
}

/* ITEM */
.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px;
    border-bottom:1px solid #eee;
}

.item:last-child{
    border-bottom:none;
}

.name{
    font-weight:600;
}

.price{
    color:#16a34a;
    font-weight:bold;
}

/* QTY */
.qty{
    display:flex;
    align-items:center;
    gap:8px;
    background:#f3f4f6;
    padding:5px 10px;
    border-radius:10px;
}

.qty button{
    width:26px;
    height:26px;
    border:none;
    border-radius:6px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

/* REMOVE */
.remove{
    background:#ef4444;
    color:white;
    border:none;
    padding:6px 10px;
    border-radius:8px;
    cursor:pointer;
}

/* TOTAL */
.total{
    font-size:24px;
    font-weight:800;
    color:#16a34a;
}

/* BUTTON */
.btn{
    width:100%;
    padding:14px;
    background: linear-gradient(135deg,#ff6b00,#ff3d00);
    border:none;
    color:white;
    font-size:16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    margin-top:10px;
}

/* INPUT */
input{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:1px solid #ddd;
    margin-top:10px;
}

/* MAP */
#map{
    height:260px;
    border-radius:10px;
    margin-top:10px;
}

/* EMPTY */
.empty{
    text-align:center;
    padding:30px;
    color:#777;
}

/* MOBILE */
@media(max-width:900px){
    .page{
        flex-direction:column;
    }
}

</style>

<div class="page">

    <!-- LEFT -->
    <div class="left">
        <div class="card">
            <h2>🛒 Your Cart</h2>
            <div id="cart"></div>
        </div>
    </div>

    <!-- RIGHT -->
    <div class="right">

        <div class="card">
            <h3>💰 Summary</h3>
            <hr>
            <p>Total Amount</p>
            <div class="total">₹<span id="total">0</span></div>
        </div>

        <div class="card">
            <h3>📍 Delivery Location</h3>
            <input id="locText" readonly placeholder="Select location on map">
            <div id="map"></div>
        </div>

        <button class="btn" onclick="placeOrder()">
            🚀 Place Order
        </button>

    </div>

</div>

<script>

/* MAP */
let map = L.map('map').setView([18.5204, 73.8567], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap'
}).addTo(map);

let selectedLocation = null;

map.on("click", function(e){

    let lat = e.latlng.lat.toFixed(6);
    let lng = e.latlng.lng.toFixed(6);

    selectedLocation = `${lat},${lng}`;

    document.getElementById("locText").value = "Loading address...";

    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
    .then(res=>res.json())
    .then(data=>{
        document.getElementById("locText").value =
            data.display_name || selectedLocation;
    })
    .catch(()=>{
        document.getElementById("locText").value = selectedLocation;
    });
});

/* CART */
function getCart(){
    try{
        return JSON.parse(localStorage.getItem("cart")) || [];
    }catch(e){
        return [];
    }
}

function saveCart(cart){
    localStorage.setItem("cart", JSON.stringify(cart));
}

/* LOAD */
function load(){
    let cart = getCart();
    let box = document.getElementById("cart");
    box.innerHTML = "";

    if(cart.length === 0){
        box.innerHTML = `<div class="empty">🛒 Cart is empty</div>`;
        updateTotal();
        return;
    }

    cart.forEach((item,i)=>{

        item.price = Number(item.price || 0);
        item.quantity = Number(item.quantity || 1);

        box.innerHTML += `
        <div class="item">
            <div>
                <div class="name">${item.name}</div>
                <div class="price">₹${item.price}</div>
            </div>

            <div class="qty">
                <button onclick="qty(${i},-1)">-</button>
                ${item.quantity}
                <button onclick="qty(${i},1)">+</button>
            </div>

            <button class="remove" onclick="removeItem(${i})">✖</button>
        </div>`;
    });

    updateTotal();
}

/* QTY */
function qty(i,v){
    let cart = getCart();

    cart[i].quantity = Number(cart[i].quantity || 1) + v;

    if(cart[i].quantity <= 0){
        cart.splice(i,1);
    }

    saveCart(cart);
    load();
}

/* REMOVE */
function removeItem(i){
    let cart = getCart();
    cart.splice(i,1);
    saveCart(cart);
    load();
}

/* TOTAL */
function updateTotal(){
    let cart = getCart();
    let total = 0;

    cart.forEach(i=>{
        total += Number(i.price || 0) * Number(i.quantity || 1);
    });

    document.getElementById("total").innerText = total;
}

/* PLACE ORDER */
function placeOrder(){

    let cart = getCart();

    if(cart.length === 0){
        alert("Cart empty");
        return;
    }

    if(!selectedLocation){
        alert("Select delivery location");
        return;
    }

    fetch("/confirm_order",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({
            cart: cart,
            location: selectedLocation
        })
    })
    .then(res=>res.json())
    .then(data=>{
        if(data.success){
            alert("Order placed successfully!");
            localStorage.removeItem("cart");
            window.location.href="/payments";
        }else{
            alert(data.message || "Failed");
        }
    })
    .catch(()=>{
        alert("Server error");
    });
}

load();

</script>

{% endblock %}
